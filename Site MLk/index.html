<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLK - A Dream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    @font-face {
        font-family: 'MLKFont';
        src: url('wolfsbane2ii.ttf') format('truetype');
    }
    h1 {
        font-family: 'MLKFont', sans-serif;
        font-size: 5rem;
    }
    #formulario p {
        font-family: 'MLKFont', sans-serif;
        font-size: 2rem;
    }
</style>
<body class="bg-black">
    <section class="text-white mt-5 d-flex flex-column justify-content-center align-items-center">
        <div class="d-flex flex-row align-items-center gap-3 mb-4">
            <img src="PunhoBlackPhanter.png" alt="simboloBlackPhanter" style="width: 80px; height: 80px;" class="rounded-circle">
            <h1 class="m-0">MLK</h1>
        </div>
        <div class="d-flex flex-column gap-0" id="formulario"> 
            <p>Name</p>
            <input type="text" name="name" placeholder="Enter your name" class="form-control">
            <p>Email</p>
            <input type="email" name="email" placeholder="Enter your email" class="form-control"><br>
            <p>Password</p>
            <input type="password" name="password" placeholder="Enter your password" class="form-control"><br>
            <button type="submit" class="btn btn-outline-white text-white border-white">Sign Up</button>
        </div>
    </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
