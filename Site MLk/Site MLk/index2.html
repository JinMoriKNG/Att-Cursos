<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .carousel-inner {
            height: 100vh;
        }

        .carousel-item {
            height: 100%;
            text-align: center;
        }

        .carousel-item.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-item img {
            width: 50vw;
            height: 70vh;
            margin: 0 auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-black">
    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3" aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4" aria-label="Slide 5"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="MLK_Jr.jfif" alt="IMG_MLK" class="rounded-4">
            </div>
            <div class="carousel-item">
                <img src="Djavan.jfif" alt="IMG_Djavan" class="rounded-4">
            </div>
            <div class="carousel-item">
                <img src="Emicida.jfif" alt="IMG_Emicida" class="rounded-4">
            </div>
            <div class="carousel-item">
                <img src="ChadwickBlackPhanter.jfif" alt="IMG_Chadwick_Boseman" class="rounded-4">
            </div>
            <div class="carousel-item">
                <img src="PanterasNegras.png" alt="IMG_Black_Panthers" class="rounded-4">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        if (!sessionStorage.getItem('autentication')) {
            window.location.href = 'index.html';
        }

        const nome = localStorage.getItem('name');
        const sobrenome = localStorage.getItem('sobrenome');
        document.getElementById('output').innerText = `Nome: ${nome} ${sobrenome}`;
    </script>
</body>
</html>
